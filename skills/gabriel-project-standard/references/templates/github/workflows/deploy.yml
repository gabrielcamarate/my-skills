name: Production Deploy

# Publishes the exact commit that reached main (projects with staging). Promotion does
# not rerun the suite, so main-ready is the guard: main must be the promotion merge
# commit, with the same tree as the promoted staging tip whose heavy suite was green.
# Anything else (direct commit, squash, diverging tree, tip off staging, heavy run
# missing/pending/red) blocks here, before install, without running the suite
# (my-skills#17, Maison #431). Without staging, drop the guard step (SKILL.md).
# Secrets reach only the Deploy step; `production` environment approval is the gate.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require approved staging tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/__PROJECT__-workflow.py main-ready --sha "$GITHUB_SHA"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # __DEPLOY_COMMAND__: build e publicação do projeto. Segredos só neste passo, em `env:`
      # (ex.: CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}).
      - name: Deploy
        run: __DEPLOY_COMMAND__
