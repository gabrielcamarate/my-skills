name: Pull Request Quality

# Akita: cheap PR into staging; heavy staging runs after merge (staging-quality.yml).
# PR into main (promotion) never reruns the suite: it requires the heavy run completed
# and green on the exact staging SHA (staging-ready --promotion) plus a strict audit.
# The push to main then only checks that main's tree equals the approved staging tree
# and runs the full suite only if they diverge (decision of 2026-10-22).
on:
  # `edited` re-runs the gate when a PR base changes (e.g. staging -> main), so the fast
  # check of a staging PR can never satisfy main. No job-level `if`: skipped counts as green.
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - staging

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR candidates can be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-quality:
    name: release-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # __DUMMY_ENV__: variáveis falsas e públicas que o build/testes exigem (nunca segredos reais)
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Enforce promotion source
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          # Only the repository's own staging may open a PR into main (promotion).
          if [[ $EVENT == pull_request && $BASE_REF == main ]]; then
            [[ $HEAD_REF == staging && $HEAD_REPO == "$GITHUB_REPOSITORY" ]] \
              || { echo "PRs into main must come from this repository's staging"; exit 1; }
          fi

      # Promotion evidence: heavy suite completed and green on the exact SHA, no red or
      # audit-outage issue open. Replaces rerunning the full suite here.
      - name: Require green staging tip for promotion
        if: github.base_ref == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/__PROJECT__-workflow.py staging-ready --expected-sha "$STAGING_SHA" --promotion

      - name: Verify task scope
        if: github.base_ref == 'staging'
        run: python3 scripts/check-pr-scope.py

      - name: Verify local workflow and domain skills
        run: |
          python3 scripts/__PROJECT__-workflow.py doctor
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
          bash scripts/test-ensure-node.sh
          bash scripts/test-share-machine.sh
          node --test scripts/tests/release.test.mjs
          node scripts/release.mjs check

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan committed secrets
        run: pnpm security:secrets

      # Promotion to main: an audit source outage blocks here until audit passes.
      - name: Dependency audit (strict)
        if: github.base_ref == 'main'
        run: python3 scripts/dependency-audit.py

      # Cheap verifiers for task PRs only; the heavy suite runs after the staging merge.
      - name: Run release gate
        if: github.base_ref == 'staging'
        run: |
          pnpm typecheck
          pnpm lint
