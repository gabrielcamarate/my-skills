name: Staging Heavy Quality

on:
  push:
    branches: [staging]

permissions:
  contents: read

# Never cancel heavy evidence or its recovery reporter.
concurrency:
  group: staging-heavy-${{ github.sha }}
  cancel-in-progress: false

jobs:
  staging-quality:
    name: staging-quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      audit: ${{ steps.audit.outputs.audit }}
    env:
      # __DUMMY_ENV__: variáveis falsas e públicas que o build/testes exigem (nunca segredos reais)
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify local workflow and domain skills
        run: |
          python3 scripts/__PROJECT__-workflow.py doctor
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
          bash scripts/test-ensure-node.sh
          bash scripts/test-share-machine.sh
          node --test scripts/tests/release.test.mjs
          node scripts/release.mjs check

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan committed secrets
        run: pnpm security:secrets

      # A vulnerability is red; an audit source outage only warns here (issue
      # "audit indisponível") and promotion to main runs the audit strict.
      # Keep `pnpm audit` out of security:supply-chain so it runs only here.
      - name: Dependency audit
        id: audit
        run: python3 scripts/dependency-audit.py --soft-unavailable

      - name: Run supply-chain baseline
        run: pnpm security:supply-chain

      - name: Run OWASP evidence baseline
        run: pnpm security:owasp:evidence

      - name: Run automated security scans baseline
        run: pnpm security:scan:automated

      # `pnpm check` split so the test suite runs once (with coverage on the full gate).
      - name: Run release gate
        run: |
          pnpm typecheck
          pnpm lint

      - name: Run coverage gate
        run: pnpm test:coverage

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'next.config.ts', 'proxy.ts', 'instrumentation*.ts', 'sentry.*.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Run build gate
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke e2e gate
        run: pnpm e2e

  report-staging:
    name: report-staging
    needs: staging-quality
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    concurrency:
      group: staging-health-issue
      cancel-in-progress: false
    steps:
      # No checkout: only runner stdlib + gh, never execute code with a write token.
      - name: Reconcile staging health issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUALITY_RESULT: ${{ needs.staging-quality.result }}
          AUDIT_RESULT: ${{ needs.staging-quality.outputs.audit }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          run_id = os.environ['GITHUB_RUN_ID']
          attempt = int(os.environ['GITHUB_RUN_ATTEMPT'])

          def api(path, method='GET', data=None):
              args = ['gh', 'api', f'repos/{repo}/{path}', '--method', method]
              if data is not None:
                  args += ['--input', '-']
              result = subprocess.run(args, input=json.dumps(data) if data is not None else None,
                                      capture_output=True, text=True, check=True, timeout=30)
              return json.loads(result.stdout) if result.stdout.strip() else None

          def current():
              tip = api('git/ref/heads/staging')['object']['sha']
              run = api(f'actions/runs/{run_id}')
              return tip == sha and run['run_attempt'] == attempt

          if not current():
              print('Obsolete run; no issue mutation')
              raise SystemExit(0)
          issues, audit_issues = [], []
          for page in range(1, 101):
              batch = api(f'issues?state=open&per_page=100&page={page}')
              issues.extend(i for i in batch if not i.get('pull_request')
                            and i['title'].lower().startswith('staging vermelha'))
              audit_issues.extend(i for i in batch if not i.get('pull_request')
                                  and i['title'].lower().startswith('audit indisponível'))
              if len(batch) < 100:
                  break
          else:
              raise RuntimeError('Issue pagination limit reached')
          jobs = api(f'actions/runs/{run_id}/attempts/{attempt}/jobs?per_page=100')['jobs']
          url = f'https://github.com/{repo}/actions/runs/{run_id}/attempts/{attempt}'
          bad = [j for j in jobs if j['name'] == 'staging-quality' and j['conclusion'] != 'success']
          body = f'SHA: `{sha}`\nSuíte: {os.environ["QUALITY_RESULT"]}\nLog: {url}\n'
          for job in bad:
              body += f'\nJob: [{job["name"]}]({job["html_url"]}) — {job["conclusion"]}\n'
              body += '\n'.join(f'- {s["name"]}: {s["conclusion"]}' for s in job.get('steps', [])
                                if s.get('conclusion') in ('failure', 'cancelled', 'timed_out'))
          # Revalidate after reads; no stale run may knowingly change line state.
          if not current():
              raise SystemExit(0)
          if os.environ['QUALITY_RESULT'] == 'success':
              for issue in issues:
                  number = issue['number']
                  api(f'issues/{number}/comments', 'POST', {'body': 'Staging recuperada.\n' + body})
                  api(f'issues/{number}', 'PATCH', {"state": "closed"})
              # Audit source outage: warning only; staging-ready blocks promotion while it is open.
              audit = os.environ.get('AUDIT_RESULT', '')
              if audit == 'unavailable':
                  title = f'audit indisponível: {sha}'
                  text = 'Fonte do audit indisponível; a linha segue, a promoção espera o audit passar.\n' + body
                  if audit_issues:
                      api(f'issues/{audit_issues[0]["number"]}', 'PATCH', {'title': title, 'body': text})
                  else:
                      api('issues', 'POST', {'title': title, 'body': text, 'labels': ['audit-indisponivel']})
              elif audit == 'ok':
                  for issue in audit_issues:
                      api(f'issues/{issue["number"]}/comments', 'POST', {'body': 'Audit voltou a passar.\n' + body})
                      api(f'issues/{issue["number"]}', 'PATCH', {"state": "closed"})
          else:
              title = f'staging vermelha: {sha}'
              if issues:
                  number = issues[0]['number']
                  api(f'issues/{number}', 'PATCH', {'title': title, 'body': body})
                  # Consolidate any legacy duplicates into the canonical open issue.
                  for duplicate in issues[1:]:
                      other = duplicate['number']
                      api(f'issues/{other}/comments', 'POST', {'body': f'Consolidada em #{number}.'})
                      api(f'issues/{other}', 'PATCH', {"state": "closed"})
              else:
                  api('issues', 'POST', {'title': title, 'body': body})
          PY
